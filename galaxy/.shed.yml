name: its_fun_2_map
# Tool Shed username that owns the repository. The account must exist before
# the first `planemo shed_create`; change if registered under another name.
owner: bge-barcoding
description: Extract and validate fungal ITS barcodes from museum specimen genome skims
long_description: |
  End-to-end pipeline for low-coverage genome skims of fungarium and herbarium
  specimens: QC, UNITE pseudo-reference baiting, SPAdes assembly, two rounds of
  BLAST-based taxonomic validation, primer-based ITS extraction and a final
  per-specimen decision with submission-ready FASTAs.
homepage_url: https://github.com/museomics/its-fun-2-map
remote_repository_url: https://github.com/bge-barcoding/its-fun-2-map/tree/main/galaxy
type: unrestricted
categories:
  - Sequence Analysis
  - Assembly

# Only these files are uploaded to the Tool Shed; docs/ and anything else are left out
include:
  - its_fun_2_map.xml
  - macros.xml
  - prepare_sheet.py
  - test-data/*